<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Network camera troubleshooting layers</title>
  <desc id="desc">Five connected layers: viewing client, recorder service, network, power, and camera.</desc>
  <rect width="1200" height="500" fill="#f7f9fc"/>
  <style>.b{fill:#fff;stroke:#1f4e79;stroke-width:3;rx:18}.t{font:700 22px Arial,sans-serif;fill:#17324d}.s{font:17px Arial,sans-serif;fill:#40566b}.a{stroke:#5b7083;stroke-width:4;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5b7083"/></marker></defs>
  <g><rect class="b" x="35" y="150" width="200" height="125"/><text class="t" x="135" y="193" text-anchor="middle">Viewing client</text><text class="s" x="135" y="225" text-anchor="middle">Role, app, browser</text><text class="s" x="135" y="250" text-anchor="middle">local vs remote</text></g>
  <g><rect class="b" x="270" y="150" width="200" height="125"/><text class="t" x="370" y="193" text-anchor="middle">Recorder/service</text><text class="s" x="370" y="225" text-anchor="middle">Recording, storage</text><text class="s" x="370" y="250" text-anchor="middle">logs and time</text></g>
  <g><rect class="b" x="505" y="150" width="200" height="125"/><text class="t" x="605" y="193" text-anchor="middle">Network path</text><text class="s" x="605" y="225" text-anchor="middle">Subnet, VLAN, port</text><text class="s" x="605" y="250" text-anchor="middle">address and route</text></g>
  <g><rect class="b" x="740" y="150" width="200" height="125"/><text class="t" x="840" y="193" text-anchor="middle">Power/physical</text><text class="s" x="840" y="225" text-anchor="middle">PoE, cable, link</text><text class="s" x="840" y="250" text-anchor="middle">known-good test</text></g>
  <g><rect class="b" x="975" y="150" width="190" height="125"/><text class="t" x="1070" y="193" text-anchor="middle">Camera</text><text class="s" x="1070" y="225" text-anchor="middle">Identity, stream</text><text class="s" x="1070" y="250" text-anchor="middle">firmware and health</text></g>
  <line class="a" x1="235" y1="212" x2="260" y2="212"/><line class="a" x1="470" y1="212" x2="495" y2="212"/><line class="a" x1="705" y1="212" x2="730" y2="212"/><line class="a" x1="940" y1="212" x2="965" y2="212"/>
  <text class="t" x="600" y="75" text-anchor="middle">Test each layer before restarting the whole system</text>
  <text class="s" x="600" y="355" text-anchor="middle">A working client does not prove recording. A ping does not prove video. An online camera does not prove playback.</text>
  <text class="s" x="600" y="390" text-anchor="middle">Validate live view, new recording, playback, timestamp, alerts, and the user’s original workflow.</text>
</svg>
