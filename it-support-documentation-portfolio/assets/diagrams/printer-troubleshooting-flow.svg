<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Printer troubleshooting decision path</title>
  <desc id="desc">A decision path from scope and physical checks through queue, application, connectivity, driver, controlled change, and validation.</desc>
  <rect width="1200" height="680" fill="#f7f9fc"/>
  <style>
    .box{fill:#fff;stroke:#1f4e79;stroke-width:3;rx:16}.gate{fill:#eaf2f8;stroke:#1f4e79;stroke-width:3;rx:16}.last{fill:#eef7ee;stroke:#2f6f3e;stroke-width:3;rx:16}.t{font:700 23px Arial,sans-serif;fill:#17324d}.s{font:18px Arial,sans-serif;fill:#34495e}.a{stroke:#5b7083;stroke-width:4;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5b7083"/></marker></defs>
  <rect class="box" x="55" y="65" width="250" height="105"/><text class="t" x="180" y="105" text-anchor="middle">1. Define scope</text><text class="s" x="180" y="137" text-anchor="middle">User, app, file, device</text>
  <rect class="box" x="365" y="65" width="250" height="105"/><text class="t" x="490" y="105" text-anchor="middle">2. Check device</text><text class="s" x="490" y="137" text-anchor="middle">Power, media, display, cable</text>
  <rect class="box" x="675" y="65" width="250" height="105"/><text class="t" x="800" y="105" text-anchor="middle">3. Check queue</text><text class="s" x="800" y="137" text-anchor="middle">Pause, errors, stuck jobs</text>
  <rect class="box" x="895" y="245" width="250" height="105"/><text class="t" x="1020" y="285" text-anchor="middle">4. Isolate scope</text><text class="s" x="1020" y="317" text-anchor="middle">Second file, app, or PC</text>
  <rect class="box" x="585" y="245" width="250" height="105"/><text class="t" x="710" y="285" text-anchor="middle">5. Verify path</text><text class="s" x="710" y="317" text-anchor="middle">USB, TCP/IP, WSD, share</text>
  <rect class="gate" x="275" y="245" width="250" height="105"/><text class="t" x="400" y="285" text-anchor="middle">6. Approved change</text><text class="s" x="400" y="317" text-anchor="middle">Driver, queue, or port</text>
  <rect class="gate" x="55" y="425" width="250" height="105"/><text class="t" x="180" y="465" text-anchor="middle">7. Last resort</text><text class="s" x="180" y="497" text-anchor="middle">Backup, approval, rollback</text>
  <rect class="last" x="365" y="425" width="470" height="105"/><text class="t" x="600" y="465" text-anchor="middle">8. Validate the original workflow</text><text class="s" x="600" y="497" text-anchor="middle">User test, second test, record outcome</text>
  <rect class="last" x="895" y="425" width="250" height="105"/><text class="t" x="1020" y="465" text-anchor="middle">Escalate with evidence</text><text class="s" x="1020" y="497" text-anchor="middle">Scope, tests, logs, changes</text>
  <path class="a" d="M305 118 H355"/><path class="a" d="M615 118 H665"/><path class="a" d="M925 118 C1020 118 1020 180 1020 235"/><path class="a" d="M895 298 H845"/><path class="a" d="M585 298 H535"/><path class="a" d="M400 350 C400 390 180 380 180 415"/><path class="a" d="M305 478 H355"/><path class="a" d="M835 478 H885"/>
  <text class="s" x="600" y="615" text-anchor="middle">Change one condition at a time. Record the result. Stop when authority or recovery is missing.</text>
</svg>
