<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized network incident before and after</title>
  <desc id="desc">The before view contains an unnecessary router and unclear paths. The after view shows internet service to a security gateway, switch, and endpoints.</desc>
  <rect width="1200" height="650" fill="#f7f9fc"/>
  <style>.b{fill:#fff;stroke:#1f4e79;stroke-width:3;rx:14}.bad{fill:#fff2f0;stroke:#a63c32;stroke-width:3;rx:14}.good{fill:#eef7ee;stroke:#2f6f3e;stroke-width:3;rx:14}.t{font:700 22px Arial,sans-serif;fill:#17324d}.s{font:17px Arial,sans-serif;fill:#40566b}.l{stroke:#5b7083;stroke-width:4;fill:none}</style>
  <text class="t" x="300" y="55" text-anchor="middle">Before: unclear and layered</text><text class="t" x="900" y="55" text-anchor="middle">After: documented target path</text>
  <rect class="b" x="205" y="90" width="190" height="70"/><text class="t" x="300" y="133" text-anchor="middle">Internet service</text>
  <rect class="b" x="205" y="205" width="190" height="70"/><text class="t" x="300" y="248" text-anchor="middle">Security gateway</text>
  <rect class="b" x="90" y="335" width="190" height="70"/><text class="t" x="185" y="378" text-anchor="middle">Ethernet switch</text>
  <rect class="bad" x="330" y="335" width="190" height="70"/><text class="t" x="425" y="365" text-anchor="middle">Extra router</text><text class="s" x="425" y="390" text-anchor="middle">role unclear</text>
  <rect class="b" x="35" y="500" width="160" height="70"/><text class="t" x="115" y="543" text-anchor="middle">Workstation A</text>
  <rect class="b" x="220" y="500" width="160" height="70"/><text class="t" x="300" y="543" text-anchor="middle">Workstation B</text>
  <rect class="b" x="405" y="500" width="160" height="70"/><text class="t" x="485" y="530" text-anchor="middle">Transaction</text><text class="s" x="485" y="555" text-anchor="middle">appliance</text>
  <path class="l" d="M300 160 V205M300 275 L185 335M300 275 L425 335M185 405 L115 500M185 405 L300 500M425 405 L485 500"/>
  <rect class="good" x="805" y="90" width="190" height="70"/><text class="t" x="900" y="133" text-anchor="middle">Internet service</text>
  <rect class="good" x="805" y="205" width="190" height="70"/><text class="t" x="900" y="248" text-anchor="middle">Security gateway</text>
  <rect class="good" x="805" y="335" width="190" height="70"/><text class="t" x="900" y="378" text-anchor="middle">Ethernet switch</text>
  <rect class="good" x="635" y="500" width="160" height="70"/><text class="t" x="715" y="543" text-anchor="middle">Workstation A</text>
  <rect class="good" x="820" y="500" width="160" height="70"/><text class="t" x="900" y="543" text-anchor="middle">Workstation B</text>
  <rect class="good" x="1005" y="500" width="160" height="70"/><text class="t" x="1085" y="530" text-anchor="middle">Transaction</text><text class="s" x="1085" y="555" text-anchor="middle">appliance</text>
  <path class="l" d="M900 160 V205M900 275 V335M900 405 L715 500M900 405 V500M900 405 L1085 500"/>
  <text class="s" x="600" y="625" text-anchor="middle">The extra router was removed from the active path; the result was validated through the business transaction, not link lights alone.</text>
</svg>
